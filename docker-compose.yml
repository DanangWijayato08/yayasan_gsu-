version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gsu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gsu_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_local_password
    ports:
      - "5432:5432"
    volumes:
      - gsu_pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: gsu_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  gsu_pgdata:

